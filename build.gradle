/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.1.4'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.springframework.boot.spring.boot.starter.security
    api libs.org.springframework.boot.spring.boot.starter.actuator
    api libs.org.springframework.boot.spring.boot.starter.data.jpa
    api libs.org.springframework.boot.spring.boot.starter.validation
    api libs.org.springframework.boot.spring.boot.starter.hateoas
    api libs.org.postgresql.postgresql
    api libs.org.springdoc.springdoc.openapi.starter.webmvc.ui
    api libs.me.paulschwarz.spring.dotenv
    api libs.io.jsonwebtoken.jjwt.api
    api libs.com.fasterxml.jackson.core.jackson.databind
    api libs.javax.xml.bind.jaxb.api
    api libs.org.glassfish.jaxb.jaxb.runtime
    api libs.org.springframework.boot.spring.boot.starter.oauth2.resource.server
    api libs.software.amazon.awssdk.sts
    api libs.software.amazon.awssdk.secretsmanager
    api libs.software.amazon.awssdk.aws.core
    api libs.javax.annotation.javax.annotation.api
    runtimeOnly libs.org.springframework.boot.spring.boot.devtools
    runtimeOnly libs.io.jsonwebtoken.jjwt.impl
    runtimeOnly libs.io.jsonwebtoken.jjwt.jackson
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'auth_service'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
