namespace: auth-service-dev
environment: local
deploymentName: auth-service-dev
replicaCount: 1
image:
  repository: auth-service-dev
  tag: "0.0.1"
service:
  port: 8080
configMapName: "auth-service-config"
springServerPort: 8080
spring:
  port: 8080
  application:
    name: "auth-service-dev"
  profiles:
    active: dev
  datasource:
    url: "jdbc:postgresql://192.168.100.105:5432/my_local_db"
    username: "admin"
    password: "admin"
    driver:
      className: "org.postgresql.Driver"
  aws:
    accountId: "036573225753"
    region: "us-east-1"
    role:
      arn: "arn:aws:iam::{{ .Values.spring.aws.accountId }}:role/auth-service-developer-role"
    secret:
      arn: "arn:aws:secretsmanager:{{ .Values.spring.aws.region }}:{{ .Values.spring.aws.accountId }}:secret:/dev/auth-service-T1MUqr"
    webIdentityTokenFile: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"

  jpa:
    hibernate:
      ddlAuto: "update"
    showSql: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
  management:
    endpoints:
      web:
        exposure:
          include: "*"
  logging:
    level:
      com:
        auth:
          service: "debug"
  doc:
    api:
      docs:
        path: "/v1/api-docs"
    swagger:
      uiPath: "/swagger-ui.html"

